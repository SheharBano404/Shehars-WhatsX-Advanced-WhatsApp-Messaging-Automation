name: CI Pipeline - Build, Test & Scan

on:
  push:
    branches: [ "main", "staging", "production" ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: ci-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Staging Ansible Playbook
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: staging-playbook.yml
          options: |
            --connection=local

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production  # Yeh manual approval gate activate karega!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Production Ansible Playbook
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: production-playbook.yml
          options: |
            --connection=local