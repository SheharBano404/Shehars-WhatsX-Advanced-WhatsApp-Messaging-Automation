---
- name: Deploy to Staging Environment
  hosts: localhost
  connection: local
  tasks:
    - name: Ensure pip and requests are installed for docker module
      pip:
        name: 
          - requests
          - docker
        state: present
      become: yes

    - name: Pull and start staging container
      docker_container:
        name: whats-app-staging
        image: ghcr.io/sheharbano404/shehars-whats-x-advanced-whatsapp-messaging-automation:main
        state: started
        recreate: yes
        ports:
          - "5001:5000"